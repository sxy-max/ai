name: go-ai-agentscope

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goai}
      POSTGRES_DB: ${POSTGRES_DB:-go_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [agent-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks: [agent-internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-goai}:${POSTGRES_PASSWORD:-goai}@postgres:5432/${POSTGRES_DB:-go_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ARTIFACTS_ROOT: /data/artifacts
      WORKSPACES_ROOT: /data/workspaces
      GO_AI_CONTROL_ROOT: /data/go-ai-control
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:?set ACCESS_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      EXA_API_KEY: ${EXA_API_KEY:-}
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    networks: [agent-internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  task-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["node", "scripts/task-worker.cjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-goai}:${POSTGRES_PASSWORD:-goai}@postgres:5432/${POSTGRES_DB:-go_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ARTIFACTS_ROOT: /data/artifacts
      WORKSPACES_ROOT: /data/workspaces
      GO_AI_CONTROL_ROOT: /data/go-ai-control
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:?set ACCESS_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      EXA_API_KEY: ${EXA_API_KEY:-}
    volumes:
      - app-data:/data
    networks: [agent-internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      web: { condition: service_started }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  sandbox-daemon:
    image: docker:27-dind-rootless
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-data:/home/rootless/.local/share/docker
      - docker-certs:/certs/client
      - agent-workspaces:/data/workspaces
    networks: [agent-internal]
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  workspace-permissions:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /data/workspaces && chown -R 10001:10001 /data/workspaces"]
    volumes:
      - agent-workspaces:/data/workspaces
    restart: "no"

  agent-runtime:
    build:
      context: ../../services/agent-runtime
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      AGENTSCOPE_WORKSPACE_ROOT: /data/workspaces
      AGENTSCOPE_SANDBOX_IMAGE: ${AGENTSCOPE_SANDBOX_IMAGE:-python:3.11-slim}
      AGENTSCOPE_DOWNLOAD_SECRET: ${AGENTSCOPE_DOWNLOAD_SECRET:?set AGENTSCOPE_DOWNLOAD_SECRET}
      DOCKER_HOST: tcp://sandbox-daemon:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - agent-workspaces:/data/workspaces
      - docker-certs:/certs/client:ro
    expose: ["8000"]
    networks: [agent-internal]
    depends_on:
      redis: { condition: service_healthy }
      sandbox-daemon: { condition: service_healthy }
      workspace-permissions: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

networks:
  agent-internal:
    internal: true

volumes:
  postgres-data:
  redis-data:
  docker-data:
  docker-certs:
  agent-workspaces:
  app-data:
